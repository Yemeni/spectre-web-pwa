    <style>

:root {
    color-scheme: dark;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background-color: #02161a;
}
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 15% 20%, rgba(82, 205, 196, 0.2), transparent 55%),
                radial-gradient(circle at 85% 15%, rgba(22, 116, 145, 0.18), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(11, 57, 82, 0.65), transparent 60%),
                #02161a;
    color: #e3f8f9;
}
a {
    color: #8ef2ea;
}
.banner {
    background: rgba(3, 48, 54, 0.9);
    border-bottom: 1px solid rgba(142, 242, 234, 0.25);
    text-align: center;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
}
.banner h4 {
    margin: 0 0 0.25rem;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: #8ef2ea;
}
main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem 3rem;
    gap: 2rem;
}
.card {
    width: min(520px, 100%);
    background: rgba(2, 26, 31, 0.9);
    border: 1px solid rgba(142, 242, 234, 0.22);
    border-radius: 24px;
    padding: 2.25rem 2rem;
    box-shadow: 0 18px 45px rgba(1, 18, 24, 0.75);
    backdrop-filter: blur(18px);
}
h1, h2 {
    margin: 0 0 1.25rem;
    text-align: center;
    font-weight: 700;
    letter-spacing: 0.08em;
}
h1 {
    font-size: 1.9rem;
}
h2 {
    font-size: 1.5rem;
    color: #8ef2ea;
}
form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.field {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
}
.field label {
    font-weight: 600;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
input, select, button, textarea {
    font: inherit;
    border-radius: 14px;
    border: 1px solid rgba(142, 242, 234, 0.25);
    padding: 0.85rem 1rem;
    color: inherit;
    background: rgba(255, 255, 255, 0.04);
    transition: border 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
}
input:focus, select:focus, button:focus {
    outline: none;
    border-color: rgba(142, 242, 234, 0.65);
    box-shadow: 0 0 0 2px rgba(62, 137, 137, 0.35);
}
button {
    background: linear-gradient(135deg, #3e8989, #1f555d);
    border: none;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}
button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
}
button:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: none;
}
button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    box-shadow: none;
}
.radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.2rem;
    justify-content: center;
}
.radio-group label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.radio-group input[type="radio"] {
    width: 1rem;
    height: 1rem;
    accent-color: #3e8989;
}
.status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
}
.spinner {
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-top-color: #8ef2ea;
    animation: spin 0.8s linear infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
[hidden] {
    display: none !important;
}
.message {
    min-height: 1.4rem;
    font-size: 0.95rem;
    text-align: center;
}
.message.error {
    color: #ff8a8a;
}
.caption {
    text-align: center;
    font-size: 0.85rem;
    opacity: 0.7;
    margin-top: 0.75rem;
}
.result-field {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
}
.result-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
}
.result-controls button {
    flex: 0 0 auto;
}
.result-controls input {
    flex: 1 1 220px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(142, 242, 234, 0.45);
}
.copy-notice {
    text-align: center;
    font-size: 0.85rem;
    min-height: 1.2rem;
    color: rgba(142, 242, 234, 0.85);
}
section[data-active="false"] {
    display: none;
}
.saved-sites {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
}
.saved-sites select {
    flex: 1 1 200px;
}
.saved-sites button {
    flex: 0 0 auto;
    padding-inline: 0.9rem;
}
.saved-status {
    min-height: 1.2rem;
    font-size: 0.85rem;
    text-align: center;
    color: rgba(142, 242, 234, 0.85);
}
@media (max-width: 640px) {
    .card {
        padding: 1.75rem 1.5rem;
    }
    h1 {
        font-size: 1.6rem;
    }
    .radio-group {
        gap: 0.5rem 0.8rem;
    }
}

    </style>
</head>
<body>
    <div class="banner">
        <h4>Alpha Version</h4>
        <p>You are trying out a pre-release of Spectre's web version. <a href="https://gitlab.com/spectre.app/web/">Source Code</a></p>
    </div>
    <main>
        <section id="user" class="card" data-active="true">
            <h1>Spectre</h1>
            <p class="caption">Your information remains 100% offline.</p>
            <form id="userForm" autocomplete="on">
                <div class="field">
                    <label for="userNameInput">Your Full Name</label>
                    <input id="userNameInput" type="text" placeholder="eg. Robert Lee Mitchell" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="userSecretInput">Your Spectre Secret</label>
                    <div class="status-row">
                        <input id="userSecretInput" type="password" placeholder="eg. banana colored duckling" autocomplete="current-password" required>
                        <span id="userSpinner" class="spinner" hidden></span>
                    </div>
                </div>
                <div class="field">
                    <label for="userAlgorithm">Algorithm Version</label>
                    <select id="userAlgorithm">
                        <option value="0">V0 (2012:03)</option>
                        <option value="1">V1 (2012:07)</option>
                        <option value="2">V2 (2014:09)</option>
                        <option value="3">V3 (2015:01)</option>
                    </select>
                </div>
                <p id="userError" class="message error" hidden></p>
                <button type="submit">Sign In</button>
            </form>
        </section>
        <section id="site" class="card" data-active="false">
            <h2>Generate Site Result</h2>
            <form id="siteForm" autocomplete="off">
                <div class="field">
                    <label for="siteNameInput">Site Domain</label>
                    <input id="siteNameInput" type="text" placeholder="eg. twitter.com">
                    <div class="saved-sites">
                        <select id="sitePicker"></select>
                        <button type="button" id="saveSite">Save</button>
                        <button type="button" id="deleteSite">Delete</button>
                        <button type="button" id="exportSites">Export</button>
                    </div>
                    <p id="savedStatus" class="saved-status" hidden></p>
                </div>
                <div class="field">
                    <div class="radio-group">
                        <label><input type="radio" name="sitePurpose" value="com.lyndir.masterpassword" checked> Password</label>
                        <label><input type="radio" name="sitePurpose" value="com.lyndir.masterpassword.login"> Login Name</label>
                        <label><input type="radio" name="sitePurpose" value="com.lyndir.masterpassword.answer"> Security Answer</label>
                    </div>
                </div>
                <div class="field">
                    <label for="siteCounterInput">Site Counter</label>
                    <input id="siteCounterInput" type="number" min="1" max="4294967295" value="1">
                </div>
                <div class="field">
                    <label for="siteTypeSelect">Result Type</label>
                    <select id="siteTypeSelect"></select>
                </div>
                <div class="field result-field">
                    <label for="siteResultInput">Result</label>
                    <div class="result-controls">
                        <input id="siteResultInput" class="code" readonly>
                        <button type="submit" id="copyResultButton">Copy</button>
                        <span id="siteSpinner" class="spinner" hidden></span>
                    </div>
                    <div id="copyNotice" class="copy-notice"></div>
                </div>
                <p id="siteError" class="message error" hidden></p>
                <button type="button" id="signout">Sign Out</button>
            </form>
            <p class="caption">Your information remains 100% offline.</p>
        </section>
    </main>

/**
 * spectre-types
 * =============
 *
 * This file is responsible for providing Spectre's constants and algorithm configuration.
 *
 * It creates the global `spectre` object and attaches the following properties to it:
 * `encoder`, `algorithm`, `purpose`, `class`, `feature`, `resultType`, `counter`, `templates`, `characters`, `identicons`:
 * They are used to obtain information on Spectre's range of capabilities and to communicate with the Spectre APIs.
 */

let spectre = {}
spectre.encoder = Object.freeze(new TextEncoder());
spectre.algorithm = {
    /** (2012-03-05) V0 incorrectly performed host-endian math with bytes translated into 16-bit network-endian. */
    v0: 0,
    /** (2012-07-17) V1 incorrectly sized site name fields by character count rather than byte count. */
    v1: 1,
    /** (2014-09-24) V2 incorrectly sized user name fields by character count rather than byte count. */
    v2: 2,
    /** (2015-01-15) V3 is the current version. */
    v3: 3,
};
spectre.algorithm = Object.freeze({
    ...spectre.algorithm,
    current: spectre.algorithm.v3,
    first: spectre.algorithm.v0,
    last: spectre.algorithm.v3,
});
spectre.purpose = Object.freeze({
    /** Generate a key for authentication. */
    authentication: "com.lyndir.masterpassword",
    /** Generate a name for identification. */
    identification: "com.lyndir.masterpassword.login",
    /** Generate a recovery token. */
    recovery: "com.lyndir.masterpassword.answer",
});
spectre.class = Object.freeze({
    /** Use the site key to generate a result from a template. */
    template: 1 << 4,
    /** Use the site key to encrypt and decrypt a stateful entity. */
    stateful: 1 << 5,
    /** Use the site key to derive a site-specific object. */
    derive: 1 << 6,
});
spectre.feature = Object.freeze({
    none: 0,
    /** Export the key-protected content data. */
    exportContent: 1 << 10,
    /** Never export content. */
    devicePrivate: 1 << 11,
    /** Don't use this as the primary authentication result type. */
    alternate: 1 << 12,
});
spectre.resultType = {
    /** 0: Don't produce a result */
    none: 0,

    /** 16: pg^VMAUBk5x3p%HP%i4= */
    templateMaximum: 0x0 | spectre.class.template | spectre.feature.none,
    /** 17: BiroYena8:Kixa */
    templateLong: 0x1 | spectre.class.template | spectre.feature.none,
    /** 18: BirSuj0- */
    templateMedium: 0x2 | spectre.class.template | spectre.feature.none,
    /** 19: Bir8 */
    templateShort: 0x3 | spectre.class.template | spectre.feature.none,
    /** 20: pO98MoD0 */
    templateBasic: 0x4 | spectre.class.template | spectre.feature.none,
    /** 21: 2798 */
    templatePIN: 0x5 | spectre.class.template | spectre.feature.none,
    /** 30: birsujano */
    templateName: 0xE | spectre.class.template | spectre.feature.none,
    /** 31: bir yennoquce fefi */
    templatePhrase: 0xF | spectre.class.template | spectre.feature.none,

    /** 1056: Custom saved result. */
    statePersonal: 0x0 | spectre.class.stateful | spectre.feature.exportContent,
    /** 2081: Custom saved result that should not be exported from the device. */
    stateDevice: 0x1 | spectre.class.stateful | spectre.feature.devicePrivate,

    /** 4160: Derive a unique binary key. */
    deriveKey: 0x0 | spectre.class.derive | spectre.feature.alternate,
};
spectre.resultType = Object.freeze({
    ...spectre.resultType,
    defaultPassword: spectre.resultType.templateLong,
    defaultLogin: spectre.resultType.templateName,
    defaultAnswer: spectre.resultType.templatePhrase,
});
spectre.resultName = Object.freeze({
    [spectre.resultType.templateMaximum]: "Maximum",
    [spectre.resultType.templateLong]: "Long",
    [spectre.resultType.templateMedium]: "Medium",
    [spectre.resultType.templateShort]: "Short",
    [spectre.resultType.templateBasic]: "Basic",
    [spectre.resultType.templatePIN]: "PIN",
    [spectre.resultType.templateName]: "Name",
    [spectre.resultType.templatePhrase]: "Phrase",
    [spectre.resultType.statePersonal]: "Own",
    [spectre.resultType.stateDevice]: "Device",
    [spectre.resultType.deriveKey]: "Key",
});

    TOTP: 0,
    /** The initial value for a site's counter. */
    initial: 1,
};
spectre.counter = Object.freeze({

    function pbkdf2_js(password, salt, iter, keyLen, hash) {

        switch ((hash.name || hash).toUpperCase()) {
            case "SHA1":
                break;
            case "SHA224":
            case "SHA-224":
                hashLen = 224 / 8;
                break;
            case "SHA256":
            case "SHA-256":
                hashLen = 256 / 8;
                break;
            case "SHA384":
            case "SHA-384":
                hashLen = 384 / 8;
                break;
            case "SHA512":
            case "SHA-512":
                hashLen = 512 / 8;
                break;
            default:
                let err = new Error(`Unsupported hash: ${hash}`);
                err.name = "InvalidAccessError";
                return Promise.reject(err);
        }

        let data     = new Uint8Array(salt.length + 4/*sizeof(uint32)*/);
        let dataView = new DataView(data.buffer, data.byteOffset, data.byteLength);

        data.set(salt);

        return crypto.subtle.importKey("raw", password, {
                name: "HMAC",
                hash: hash
            }, false/*not extractable*/, [ "sign" ]).then(function (key) {
                let numBlocks = ((keyLen + hashLen - 1) / hashLen) | 0;
                let dk = new Uint8Array(numBlocks * hashLen);
                let x = Promise.resolve();

                for (let block = 1, dki = 0; block <= numBlocks; block++, dki += hashLen) {
                    x = x.then(() => dataView.setUint32(salt.length, block, false/*big-endian*/))
                        .then(() => crypto.subtle.sign({
                            name: "HMAC",
                            hash: hash
                        }, key, data))
                        .then(pdk => (dk.set(new Uint8Array(pdk), dki), pdk));

                    for (let n = 2; n <= iter; n++) {
                        x = x.then(U => crypto.subtle.sign({
                                name: "HMAC",
                                hash: hash
                            }, key, U)).then(function (U) {
                                let Ux = new Uint8Array(U);

                                for (let i = 0; i < Ux.length; i++) {

                                }

                            });

                }

                return x.then(() => dk.subarray(0, keyLen));
            });
    }

    return crypto.subtle.importKey("raw", password, {
            name: "PBKDF2",
            hash: hash
        }, false/*not extractable*/, [ "deriveBits" ])
        .then(key => crypto.subtle.deriveBits({
            name: "PBKDF2",
            salt: salt,
            iterations: iter,
            hash: hash

                : Promise.reject(err));

(() => {
    'use strict';
    spectre.observers = [];
    spectre.operations = {
        user: {
            pending: false,
            error: null,
            cause: null,
            userName: null,
            identicon: null,
            authenticated: false,
        },
        site: {
            pending: false,
            error: null,
            cause: null,
            result: {},
        }
    };
    let activeUser = null;

    const notify = () => {
        for (const observer of spectre.observers) {
            try {
                observer();
            } catch (error) {
                console.error('[spectre] observer error', error);
            }
        }
    };

    const resetSiteResults = () => {
        spectre.operations.site.result = {};
    };

    spectre.invalidate = Object.freeze(() => {
        if (activeUser && typeof activeUser.invalidate === 'function') {
            try {
                activeUser.invalidate();
            } catch (error) {
                console.warn('[spectre] invalidate issue', error);
            }
        }
        activeUser = null;
        spectre.operations.user.pending = false;
        spectre.operations.user.userName = null;
        spectre.operations.user.identicon = null;
        spectre.operations.user.authenticated = false;
        spectre.operations.user.error = null;
        spectre.operations.user.cause = null;
        spectre.operations.site.pending = false;
        spectre.operations.site.error = null;
        spectre.operations.site.cause = null;
        resetSiteResults();
        notify();
    });

    spectre.authenticate = Object.freeze((userName, userSecret, algorithmVersion = spectre.algorithm.current) => {
        spectre.operations.user.pending = true;
        spectre.operations.user.userName = userName;
        spectre.operations.user.error = null;
        spectre.operations.user.cause = null;
        notify();
        try {
            const user = new SpectreUser(userName, userSecret, algorithmVersion);
            activeUser = user;
            user.identiconPromise.then(identicon => {
                if (activeUser !== user) {
                    return;
                }
                spectre.operations.user.identicon = identicon;
                notify();
            }).catch(error => {
                if (activeUser !== user) {
                    return;
                }
                spectre.operations.user.error = error && error.message ? error.message : String(error);
                spectre.operations.user.cause = error && error.cause;
                notify();
            });
            user.userKeyPromise.then(() => {
                if (activeUser !== user) {
                    return;
                }
                spectre.operations.user.pending = false;
                spectre.operations.user.authenticated = true;
                notify();
            }).catch(error => {
                if (activeUser !== user) {
                    return;
                }
                spectre.operations.user.pending = false;
                spectre.operations.user.authenticated = false;
                spectre.operations.user.error = error && error.message ? error.message : String(error);
                spectre.operations.user.cause = error && error.cause;
                notify();
            });
        } catch (error) {
            spectre.operations.user.pending = false;
            spectre.operations.user.authenticated = false;
            spectre.operations.user.error = error && error.message ? error.message : String(error);
            spectre.operations.user.cause = error && error.cause;
            notify();
        }
    });

    spectre.request = Object.freeze((siteName, resultType, keyCounter, keyPurpose, keyContext) => {
        spectre.operations.site.pending = true;
        spectre.operations.site.error = null;
        spectre.operations.site.cause = null;
        notify();
        const user = activeUser;
        if (!user) {
            spectre.operations.site.pending = false;
            notify();
            return;
        }
        if (!siteName) {
            spectre.operations.site.pending = false;
            notify();
            return;
        }
        user.result(siteName, resultType, keyCounter, keyPurpose, keyContext).then(result => {
            if (activeUser !== user) {
                return;
            }
            spectre.operations.site.pending = false;
            spectre.operations.site.error = null;
            spectre.operations.site.cause = null;
            if (!spectre.operations.site.result[siteName]) {
                spectre.operations.site.result[siteName] = {};
            }
            const purposeKey = keyPurpose || '';
            const contextKey = keyContext || '';
            if (!spectre.operations.site.result[siteName][purposeKey]) {
                spectre.operations.site.result[siteName][purposeKey] = {};
            }
            spectre.operations.site.result[siteName][purposeKey][contextKey] = result;
            notify();
        }).catch(error => {
            if (activeUser !== user) {
                return;
            }
            spectre.operations.site.pending = false;
            spectre.operations.site.error = error && error.message ? error.message : String(error);
            spectre.operations.site.cause = error && error.cause;
            notify();
        });
    });

    spectre.result = Object.freeze((siteName, keyPurpose = spectre.purpose.authentication, keyContext = null) => {
        const byName = spectre.operations.site.result[siteName || ''];
        if (!byName) {
            return '';
        }
        const byPurpose = byName[keyPurpose || ''];
        if (!byPurpose) {
            return '';
        }
        return byPurpose[keyContext || ''] || '';
    });
})();

    </script>
    <script>

    document.addEventListener('DOMContentLoaded', () => {
        'use strict';
        const userSection = document.querySelector('#user');
        const siteSection = document.querySelector('#site');
        const userForm = document.querySelector('#userForm');
        const siteForm = document.querySelector('#siteForm');
        const signOutButton = document.querySelector('#signout');
        const userNameInput = document.querySelector('#userNameInput');
        const userSecretInput = document.querySelector('#userSecretInput');
        const userAlgorithmSelect = document.querySelector('#userAlgorithm');
        const userSpinner = document.querySelector('#userSpinner');
        const siteSpinner = document.querySelector('#siteSpinner');
        const userError = document.querySelector('#userError');
        const siteError = document.querySelector('#siteError');
        const siteNameInput = document.querySelector('#siteNameInput');
        const siteCounterInput = document.querySelector('#siteCounterInput');
        const siteTypeSelect = document.querySelector('#siteTypeSelect');
        const purposeRadios = Array.from(document.querySelectorAll('input[name="sitePurpose"]'));
        const siteResultInput = document.querySelector('#siteResultInput');
        const copyButton = document.querySelector('#copyResultButton');
        const copyNotice = document.querySelector('#copyNotice');
        const savedSelect = document.querySelector('#sitePicker');
        const saveButton = document.querySelector('#saveSite');
        const deleteButton = document.querySelector('#deleteSite');
        const exportButton = document.querySelector('#exportSites');
        const savedStatus = document.querySelector('#savedStatus');

        const SAVED_SITES_KEY = 'spectre_sites';
        let userFormError = '';
        let siteFormError = '';
        let copyNoticeTimeout = null;
        let lastAuthenticated = false;

        const selectedPurpose = () => {
            const checked = purposeRadios.find(radio => radio.checked);
            return checked ? checked.value : spectre.purpose.authentication;
        };

        const clampCounter = value => {
            const numeric = Number(value) || spectre.counter.default;
            return Math.min(Math.max(Math.trunc(numeric), spectre.counter.initial), spectre.counter.last);
        };

        const populateTypes = () => {
            const sorted = Object.keys(spectre.templates)
                .map(key => Number(key))
                .sort((a, b) => a - b);
            for (const value of sorted) {
                const option = document.createElement('option');
                option.value = String(value);
                option.textContent = spectre.resultName[value] || value;
                siteTypeSelect.append(option);
            }
        };

        const updateDefaults = () => {
            userAlgorithmSelect.value = String(spectre.algorithm.current);
            siteCounterInput.value = String(spectre.counter.initial);
            switch (selectedPurpose()) {
                case spectre.purpose.authentication:
                    siteTypeSelect.value = String(spectre.resultType.defaultPassword);
                    break;
                case spectre.purpose.identification:
                    siteTypeSelect.value = String(spectre.resultType.defaultLogin);
                    break;
                case spectre.purpose.recovery:
                    siteTypeSelect.value = String(spectre.resultType.defaultAnswer);
                    break;
            }
        };

        const readSavedSites = () => {
            try {
                const raw = localStorage.getItem(SAVED_SITES_KEY);
                if (!raw) {
                    return [];
                }
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
            } catch (error) {
                console.warn('Unable to read saved sites', error);
                return [];
            }
        };

        const writeSavedSites = sites => {
            try {
                const unique = Array.from(new Set(sites.map(site => site.trim()).filter(Boolean)));
                localStorage.setItem(SAVED_SITES_KEY, JSON.stringify(unique));
                return unique;
            } catch (error) {
                console.warn('Unable to write saved sites', error);
                return sites;
            }
        };

        const refreshSavedSites = (selected = '') => {
            const sites = readSavedSites();
            savedSelect.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Saved sites…';
            savedSelect.append(placeholder);
            for (const site of sites.sort((a, b) => a.localeCompare(b))) {
                const option = document.createElement('option');
                option.value = site;
                option.textContent = site;
                savedSelect.append(option);
            }
            if (selected) {
                savedSelect.value = selected;
            }
        };

        const showSavedStatus = message => {
            if (message) {
                savedStatus.textContent = message;
                savedStatus.removeAttribute('hidden');
                window.setTimeout(() => savedStatus.setAttribute('hidden', ''), 2000);
            } else {
                savedStatus.textContent = '';
                savedStatus.setAttribute('hidden', '');
            }
        };

        const requestResult = () => {
            if (!spectre.operations.user.authenticated) {
                return;
            }
            const siteName = siteNameInput.value.trim();
            const counterValue = clampCounter(siteCounterInput.value);
            siteCounterInput.value = String(counterValue);
            const typeValue = Number(siteTypeSelect.value);
            if (!Number.isFinite(typeValue)) {
                return;
            }
            spectre.request(
                siteName,
                typeValue,
                counterValue,
                selectedPurpose(),
                null
            );
        };

        const applyResultToField = () => {
            const siteName = siteNameInput.value.trim();
            const result = spectre.result(siteName, selectedPurpose());
            siteResultInput.value = result || '';
        };

        const updateCopyState = authenticated => {
            if (!authenticated) {
                copyButton.disabled = true;
                return;
            }
            copyButton.disabled = !siteResultInput.value.length;
        };

        const updateView = () => {
            const userOps = spectre.operations.user;
            const siteOps = spectre.operations.site;
            const authenticated = Boolean(userOps.authenticated);

            userSection.setAttribute('data-active', authenticated ? 'false' : 'true');
            siteSection.setAttribute('data-active', authenticated ? 'true' : 'false');

            userSpinner.hidden = !userOps.pending;
            siteSpinner.hidden = !siteOps.pending;

            const userErrorMessage = userFormError || userOps.error || '';
            userError.textContent = userErrorMessage;
            if (userErrorMessage) {
                userError.removeAttribute('hidden');
            } else {
                userError.setAttribute('hidden', '');
            }

            const siteErrorMessage = siteFormError || siteOps.error || '';
            siteError.textContent = siteErrorMessage;
            if (siteErrorMessage) {
                siteError.removeAttribute('hidden');
            } else {
                siteError.setAttribute('hidden', '');
            }

            siteForm.querySelectorAll('input, select, button').forEach(element => {
                if (element === copyButton) {
                    return;
                }
                element.disabled = !authenticated;
            });

            if (authenticated) {
                applyResultToField();
                updateCopyState(true);
                if (!lastAuthenticated) {
                    siteNameInput.focus();
                }
            } else {
                siteResultInput.value = '';
                updateCopyState(false);
                if (lastAuthenticated) {
                    userNameInput.focus();
                }
            }

            lastAuthenticated = authenticated;
        };

        const clearCopyNotice = () => {
            if (copyNoticeTimeout) {
                clearTimeout(copyNoticeTimeout);
            }
            copyNotice.textContent = '';
        };

        const showCopyNotice = message => {
            clearCopyNotice();
            copyNotice.textContent = message;
            copyNoticeTimeout = window.setTimeout(() => {
                copyNotice.textContent = '';
            }, 1600);
        };

        const copyResult = () => {
            const value = siteResultInput.value;
            if (!value) {
                showCopyNotice('Nothing to copy yet.');
                return;
            }
            const onSuccess = () => showCopyNotice('Copied to clipboard.');
            const onFailure = () => {
                siteResultInput.select();
                if (!document.execCommand('copy')) {
                    showCopyNotice('Press ⌘/Ctrl+C to copy.');
                } else {
                    showCopyNotice('Copied to clipboard.');
                }
                siteResultInput.setSelectionRange(value.length, value.length);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(value).then(onSuccess).catch(onFailure);
            } else {
                onFailure();
            }
        };

        userForm.addEventListener('submit', event => {
            event.preventDefault();
            userFormError = '';
            const name = userNameInput.value.trim();
            const secret = userSecretInput.value;
            const algorithm = Number(userAlgorithmSelect.value) || spectre.algorithm.current;
            if (!name || !secret) {
                userFormError = 'Please provide both your full name and Spectre secret.';
                updateView();
                return;
            }
            spectre.authenticate(name, secret, algorithm);
        });

        siteForm.addEventListener('submit', event => {
            event.preventDefault();
            siteFormError = '';
            copyResult();
        });

        copyButton.addEventListener('click', event => {
            event.preventDefault();
            siteFormError = '';
            copyResult();
        });

        signOutButton.addEventListener('click', () => {
            spectre.invalidate();
            userFormError = '';
            siteFormError = '';
            clearCopyNotice();
        });

        siteNameInput.addEventListener('input', () => {
            siteFormError = '';
            requestResult();
            applyResultToField();
            updateCopyState(spectre.operations.user.authenticated);
        });

        siteCounterInput.addEventListener('input', () => {
            siteFormError = '';
            requestResult();
        });

        siteTypeSelect.addEventListener('input', () => {
            siteFormError = '';
            requestResult();
        });

        purposeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                updateDefaults();
                siteFormError = '';
                requestResult();
                applyResultToField();
                updateCopyState(spectre.operations.user.authenticated);
            });
        });

        savedSelect.addEventListener('change', event => {
            const value = event.target.value;
            if (value) {
                siteNameInput.value = value;
                requestResult();
                applyResultToField();
                updateCopyState(spectre.operations.user.authenticated);
            }
        });

        saveButton.addEventListener('click', () => {
            const siteName = siteNameInput.value.trim();
            if (!siteName) {
                showSavedStatus('Enter a site name to save.');
                return;
            }
            const sites = readSavedSites();
            sites.push(siteName);
            const saved = writeSavedSites(sites);
            refreshSavedSites(siteName);
            showSavedStatus('Site saved.');
            requestResult();
        });

        deleteButton.addEventListener('click', () => {
            const selection = savedSelect.value || siteNameInput.value.trim();
            if (!selection) {
                showSavedStatus('Select a saved site to delete.');
                return;
            }
            const remaining = readSavedSites().filter(site => site !== selection);
            writeSavedSites(remaining);
            refreshSavedSites('');
            showSavedStatus('Saved site removed.');
        });

        exportButton.addEventListener('click', () => {
            const sites = readSavedSites();
            if (!sites.length) {
                showSavedStatus('No saved sites to export.');
                return;
            }
            const blob = new Blob([sites.join('
')], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            link.href = url;
            link.download = `spectre-sites-${timestamp}.txt`;
            document.body.append(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            showSavedStatus('Saved sites exported.');
        });

        populateTypes();
        refreshSavedSites('');
        updateDefaults();
        spectre.observers.push(() => {
            updateView();
            applyResultToField();
            updateCopyState(spectre.operations.user.authenticated);
        });
        updateView();
        userNameInput.focus();
    });

    </script>
    <script>

    (() => {
        'use strict';
        if (!('serviceWorker' in navigator)) {
            return;
        }
        if (location.protocol === 'file:') {
            console.info('Service workers are unavailable for file:// origins.');
            return;
        }
        const source = `const CACHE = 'spectre-inline-v1';
self.addEventListener('install', event => {
    event.waitUntil((async () => {
        const cache = await caches.open(CACHE);
        try {
            await cache.addAll(['./']);
        } catch (error) {
            console.warn('Spectre cache install', error);
        }
        self.skipWaiting();
    })());
});
self.addEventListener('activate', event => {
    event.waitUntil((async () => {
        const keys = await caches.keys();
        await Promise.all(keys.filter(key => key !== CACHE).map(key => caches.delete(key)));
        self.clients.claim();
    })());
});
self.addEventListener('fetch', event => {
    event.respondWith((async () => {
        try {
            return await fetch(event.request);
        } catch (error) {
            const cached = await caches.match(event.request);
            if (cached) {
                return cached;
            }
            throw error;
        }
    })());
});`;
        const blob = new Blob([source], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(error => {
            console.warn('Unable to register service worker', error);
        }).finally(() => {
            URL.revokeObjectURL(url);
        });
    })();

    </script>
